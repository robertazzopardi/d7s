name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: d7s
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: d7s
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: d7s
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: d7s.exe

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          target-prefix: ${{ matrix.target }}

      # Linux only: dbus dev headers required by libdbus-sys (used by keyring).
      # SQLite does not need system headers because rusqlite uses the "bundled" feature.
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d7s-${{ github.ref_name }}-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract release notes
        id: release_notes
        run: |
          awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md > release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            artifacts/d7s-${{ github.ref_name }}-linux-x86_64/d7s
            artifacts/d7s-${{ github.ref_name }}-macos-x86_64/d7s
            artifacts/d7s-${{ github.ref_name }}-macos-arm64/d7s
            artifacts/d7s-${{ github.ref_name }}-windows-x86_64/d7s.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}

